<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact LTS</title>
</head>
<body>
    <header>
        <h1>Contact Us</h1>

        <nav>
            <ul>
                <li><a href="index.html#about">About LTS</a></li>
                <li><a href="index.html#menu">Our Menu</a></li>
                <li><a href="hours.html">Store Hours</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

        <figure>
            <img src="images/contact.png" alt="A plate of tacos" width="400">
            <figcaption>Our tacos</figcaption>
        </figure>
    </header>

    <main>
        <section>
            <h2>Our Contact Form</h2>

            <form>
                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="message">Your Message:</label><br>
                    <textarea id="message" name="message" rows="5" cols="30"></textarea>
                </p>

                <button type="submit">Send</button>
                <button type="reset">Reset</button>
            </form>
        </section>

        <section>
            <h2>Our Location</h2>
            <address>
                123 Taco Street, Accra, Ghana<br>
                Phone: <a href="tel:+233000000000">+233 00 000 0000</a>
            </address>
        </section>
    </main>

    <footer>
        <p><a href="#">Back to Top</a></p>
        <p>Copyright &copy; The Little Taco Shop</p>
    </footer>
</body>
</html>
